# SideQuest — two-container deploy: the app + an optional Cloudflare Tunnel.
#
#   1. cp .env.example .env   and set MARSHAL_SECRET_KEY
#   2. Create a Cloudflare Tunnel (Zero Trust dashboard), set its public
#      hostname's service to http://app:4321, and put the tunnel token in
#      CLOUDFLARE_TUNNEL_TOKEN in .env.
#   3. Start it:
#        docker compose up --build -d                  # app only (LAN)
#        docker compose --profile tunnel up --build -d # app + tunnel (CGNAT)
#
# The SQLite DB and uploaded media persist in the `sidequest-data` volume.
services:
  app:
    build: .
    image: sidequest:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      DATABASE_URL: file:/data/sidequest.db
      SIDEQUEST_DATA_DIR: /data
    volumes:
      - sidequest-data:/data
    # Direct (LAN) access for testing. Remove this block to keep the app
    # reachable only through the tunnel.
    ports:
      - "4321:4321"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Only starts with `docker compose --profile tunnel up`.
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    # Token is interpolated from .env on the host; the tunnel is outbound-only
    # (no ports needed) and reaches the app at http://app:4321.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  sidequest-data:
