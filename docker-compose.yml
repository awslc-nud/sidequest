# SideQuest — the app + an optional Cloudflare Tunnel.
#
#   1. cp .env.example .env and set MARSHAL_SECRET_KEY.
#   2. Use `cloudflared tunnel login/create/route dns` to create a tunnel.
#   3. Put config.yml and the tunnel's UUID.json in %USERPROFILE%\.cloudflared.
#      In config.yml, use credentials-file: /etc/cloudflared/<UUID>.json and
#      service: http://app:4321.
#   4. Start it:
#        docker compose up --build -d                  # app only (LAN)
#        docker compose --profile tunnel up --build -d # app + tunnel (CGNAT)
#
# The SQLite DB and uploaded media persist in the `sidequest-data` volume.
services:
  app:
    # build: .
    image: ghcr.io/awslc-nud/sidequest:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      ORIGIN: https://sidequest.awslcnud.org
      DATABASE_URL: file:/data/sidequest.db
      SIDEQUEST_DATA_DIR: /data
    volumes:
      - sidequest-data:/data
    # Direct (LAN) access for testing. Remove this block to keep the app
    # reachable only through the tunnel.
    ports:
      - "4321:4321"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Only starts with `docker compose --profile tunnel up`.
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    # Locally-managed tunnel config and credentials from the Windows host.
    # Bind read-only; the config routes to the app over the Compose network.
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - type: bind
        source: "./cloudflare"
        target: /etc/cloudflared
        read_only: true

volumes:
  sidequest-data:
